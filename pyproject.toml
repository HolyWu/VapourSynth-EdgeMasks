[build-system]
requires = ["meson>=1.6.0", "meson-python>=0.18.0", "VapourSynth>=82"]
build-backend = "mesonpy"

[project]
name = "vapoursynth-edgemasks"
description = "Creates an edge mask using various operators"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["vapoursynth", "edgemasks"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Plugins",
  "Natural Language :: English",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Operating System :: Unix",
  "Programming Language :: C++",
  "Topic :: Multimedia :: Video",
]
dependencies = ["VapourSynth>=82"]
dynamic = ["license", "license-files", "version"]

[project.urls]
Repository = "https://github.com/HolyWu/VapourSynth-EdgeMasks"
Issues = "https://github.com/HolyWu/VapourSynth-EdgeMasks/issues"

[tool.meson-python.args]
install = ["--tags=runtime"]
