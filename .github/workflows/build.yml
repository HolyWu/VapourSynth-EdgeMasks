name: Build

on: [push, pull_request, workflow_dispatch]

jobs:
  build-non-windows-wheel:
    strategy:
      matrix:
        include:
        - arch: linux_x86_64
          runs-on: ubuntu-26.04
        - arch: linux_aarch64
          runs-on: ubuntu-26.04-arm
        - arch: macosx_x86_64
          runs-on: macos-26-intel
        - arch: macosx_arm64
          runs-on: macos-26
      fail-fast: false

    runs-on: ${{ matrix.runs-on }}

    steps:
    - uses: actions/checkout@v7

    - uses: pypa/cibuildwheel@v4.3.5
      env:
        CIBW_BUILD: cp314-*
        CIBW_BUILD_FRONTEND: uv
        CIBW_CONFIG_SETTINGS_LINUX: setup-args=-Dcpp_link_args=-s
        CIBW_CONFIG_SETTINGS_MACOS: setup-args=-Dcpp_link_args=-Wl,-x
        CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=13.3
        CIBW_TEST_COMMAND: >-
          python -c "import vapoursynth as vs; core = vs.core;
          [fn(core.std.BlankClip(format=f, width=64, height=48)).get_frame(0)
          for f in (vs.GRAY8, vs.GRAY16, vs.GRAYS) for fn in core.edgemasks.functions()]"
      with:
        output-dir: dist
        extras: uv

    - name: Fix tag
      run: |
        pipx run wheel tags --remove --python-tag py3 --abi-tag none dist/*.whl

    - uses: actions/upload-artifact@v7
      with:
        name: edgemasks-${{ matrix.arch }}
        path: dist

  build-windows-wheel:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
    - uses: actions/checkout@v7

    - uses: msys2/setup-msys2@v2
      with:
        msystem: CLANG64
        update: true
        pacboy: >-
          git:p
          ninja:p
          toolchain:p
          uv:p

    - name: Build
      run: |
        uv build -Csetup-args="-Dcpp_link_args=-static -s"

    - name: Fix tag
      run: |
        uvx wheel tags --remove --python-tag py3 --abi-tag none dist/*.whl

    - uses: actions/upload-artifact@v7
      with:
        name: edgemasks-sdist
        path: dist/*.tar.gz

    - uses: actions/upload-artifact@v7
      with:
        name: edgemasks-win_amd64
        path: dist/*.whl

  test-vulkan-path:
    needs: build-non-windows-wheel
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/download-artifact@v8
      with:
        name: edgemasks-linux_x86_64
        path: dist

    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    - name: Test
      run: |
        sudo apt-get update
        sudo apt-get install -y mesa-vulkan-drivers
        pip install dist/*manylinux*.whl
        python -c "import vapoursynth as vs; core = vs.core;
        [fn(core.std.BlankClip(format=f, width=64, height=48, gpu=True)).get_frame(0)
        for f in (vs.GRAY8, vs.GRAY16, vs.GRAYS, vs.GRAYH) for fn in core.edgemasks.functions()]"

  publish:
    permissions:
      id-token: write
    needs: [build-non-windows-wheel, build-windows-wheel, test-vulkan-path]
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest

    steps:
    - uses: actions/download-artifact@v8
      with:
        path: dist
        merge-multiple: true

    - uses: pypa/gh-action-pypi-publish@release/v1
